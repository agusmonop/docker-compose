name: linuxserver-nginx
services:
  app:
    cpu_shares: 90
    command: []
    container_name: nginx
    deploy:
      resources:
        limits:
          memory: 1906M
    environment:
      - NGINX_AUTORELOAD=
      - NGINX_AUTORELOAD_WATCHLIST=
      - PGID=1000
      - PUID=1000
      - TZ=Asia/Shanghai
    hostname: nginx
    image: linuxserver/nginx:1.30.4
    labels:
      icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nginx-banner.png
    ports:
      - target: 80
        published: "8008"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/nginx/config
        target: /config
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: Run 'id [USER]' for the owner of the host volume directories to get the
              UID to use here.
        - container: PGID
          description:
            en_us: Run 'id [USER]' for the owner of the host volume directories to get the
              GID to use here.
        - container: TZ
          description:
            en_us: specify a timezone to use, see this list.
        - container: NGINX_AUTORELOAD
          description:
            en_us: Set to true to enable automatic reloading of confs on change without
              stopping/restarting nginx. Your filesystem must support inotify.
              This functionality was previously offered via mod. [OPTIONAL]
        - container: NGINX_AUTORELOAD_WATCHLIST
          description:
            en_us: A pipe-separated list of additional folders for auto reload to watch in
              addition to /config/nginx [OPTIONAL]
    devices: []
    cap_add: []
    networks:
      - default
    privileged: false
networks:
  default:
    name: linuxserver-nginx_default
x-casaos:
  architectures:
    - amd64
    - arm64
  author: WisdomSky
  category: Home
  description:
    en_us: Nginx is an HTTP web server, reverse proxy, content cache, load balancer,
      TCP/UDP proxy server, and mail proxy server.
  developer: LinuxServer.io
  hostname: ""
  icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nginx-banner.png
  id: wisdomsky.linuxserver.linuxservernginx
  index: /
  is_uncontrolled: false
  main: app
  port_map: "8008"
  scheme: http
  store_app_id: linuxserver-nginx
  tagline:
    en_us: An HTTP web server, reverse proxy, content cache, load balancer, TCP/UDP
      proxy server, and mail proxy server.
  thumbnail: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/nginx-banner.png
  title:
    custom: Nginx
    en_us: Nginx (LinuxServer.io)
